<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Shop Philadelphie">
    <meta name="theme-color" content="#1D4ED8">
    <title>Shop Philadelphie - Web App Vendeur</title>

    <link rel="manifest" href="manifest.json">
    <link type="text/css" rel="stylesheet" href="styles.css">
</head>
<body style="margin: 0; padding: 0; background-color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div id="root"></div>

    <script type="module" src="Shop_philadelphie-webApp.mjs"></script>
    <script type="application/javascript" src="webApp.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js')
                    .then(reg => console.log('Service Worker enregistré !', reg.scope))
                    .catch(err => console.log('Erreur enregistrement SW:', err));
            });
        }
    </script>
</body>
</html>
